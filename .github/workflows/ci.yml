name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,models,bench,app]"

      # PARITY_OFFLINE keeps the suite honest: it must pass with no network and
      # no model downloads, against the fixture model in parity/tiny.py.
      - name: Test
        env:
          PARITY_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
        run: pytest -q --timeout=600

      - name: End-to-end demo
        env:
          PARITY_OFFLINE: "1"
        run: |
          python -m parity.cli demo --lang ja --budget 32 --out /tmp/pack-ja --offline
          python -m parity.cli inspect --pack /tmp/pack-ja --limit 10
          python -m parity.cli verify --model tiny --pack /tmp/pack-ja --offline --fixture-corpus

      - name: Benchmark smoke run
        env:
          PARITY_OFFLINE: "1"
        run: python -m benchmarks.run --demo --langs ja --budget 32 --train-steps 20 --out /tmp/run

      # The published Space is static/, checked by tests/test_space.py.
      # app.py is the Gradio reference demo; it must still import and build.
      - name: Gradio reference app builds
        run: python -c "import app; app.build_ui(); print('ok')"

      - name: Static Space assets are in sync
        run: |
          python scripts/build_space_assets.py
          git diff --exit-code -- space/
